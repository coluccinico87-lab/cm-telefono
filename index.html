<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#1c1109" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Company Manager" />
    <link rel="apple-touch-icon" href="icona-180.png" />
    <link rel="icon" href="icona-180.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bree+Serif&family=Inter:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Company Manager</title>
    <!--
      La porta della copia per il telefono. Tutto il resto — codice, dati, foto —
      sta in dati.bin, cifrato: lo si apre qui con la password e lo si monta nella
      pagina. La fa pubblica_telefono.mjs, che sostituisce le iterazioni.
    -->
    <style>
      body.porta { margin: 0; min-height: 100vh; display: grid; place-items: center;
        background: radial-gradient(circle at 50% 30%, #3d2617, #1c1109 70%); color: #f6e3a1;
        font-family: Inter, -apple-system, sans-serif; }
      .porta form { width: min(320px, calc(100vw - 32px)); text-align: center; }
      .porta img { width: 88px; height: 88px; border-radius: 20px; }
      .porta h1 { font-family: 'Bree Serif', serif; font-weight: 400; margin: 12px 0 4px; }
      .porta p { color: #d8bf90; margin: 0 0 18px; font-size: 14px; }
      .porta input[type=password] { width: 100%; box-sizing: border-box; font-size: 17px; padding: 12px 14px;
        border-radius: 10px; border: 1px solid #a06f22; background: #2a1a10; color: #efdcb4; }
      .porta label { display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 14px; margin: 12px 0; color: #d8bf90; }
      .porta button { width: 100%; font-size: 17px; font-weight: 700; padding: 12px; border: 0; border-radius: 10px;
        background: linear-gradient(#f6e3a1, #d9a441); color: #2b1a0c; }
      .porta .errore { color: #ff8a8a; min-height: 1.4em; margin-top: 10px; font-size: 14px; }
    </style>
  </head>
  <body class="porta">
    <form id="porta" hidden>
      <img src="icona-180.png" alt="" />
      <h1>Company Manager</h1>
      <p>Copia in sola lettura</p>
      <input id="password" type="password" autocomplete="current-password" placeholder="Password" required />
      <label><input id="ricorda" type="checkbox" checked /> Ricordala su questo telefono</label>
      <button type="submit">Apri</button>
      <div class="errore" id="errore"></div>
    </form>
    <div id="root"></div>
    <script type="module">
      const ITERAZIONI = 310000
      const CHIAVE = 'cm-telefono-password'
      const porta = document.getElementById('porta')
      const errore = document.getElementById('errore')

      async function apri(password) {
        const r = await fetch('dati.bin', { cache: 'no-cache' })
        if (!r.ok) throw new Error('rete')
        const tutto = new Uint8Array(await r.arrayBuffer())
        const sale = tutto.slice(0, 16), iv = tutto.slice(16, 28), cifrato = tutto.slice(28)
        const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey'])
        const chiave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: sale, iterations: ITERAZIONI, hash: 'SHA-256' },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'])
        let compresso
        try {
          compresso = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, chiave, cifrato)
        } catch {
          throw new Error('password')
        }
        const testo = await new Response(new Blob([compresso]).stream().pipeThrough(new DecompressionStream('gzip'))).text()
        return JSON.parse(testo)
      }

      function monta({ codice, stile, dati, aggiornato }) {
        porta.remove()
        document.body.className = ''
        document.querySelector('style').remove()
        const s = document.createElement('style')
        s.textContent = stile
        document.head.appendChild(s)
        window.__CM_DATI__ = dati
        window.__CM_AGGIORNATO__ = aggiornato
        const script = document.createElement('script')
        script.type = 'module'
        script.src = URL.createObjectURL(new Blob([codice], { type: 'text/javascript' }))
        document.body.appendChild(script)
      }

      async function prova(password, ricorda) {
        try {
          const contenuto = await apri(password)
          try { ricorda ? localStorage.setItem(CHIAVE, password) : localStorage.removeItem(CHIAVE) } catch {}
          monta(contenuto)
        } catch (e) {
          porta.hidden = false
          errore.textContent = e.message === 'password' ? 'Password sbagliata.'
            : e.message === 'rete' ? 'Non riesco a scaricare i dati: c’è rete?'
            : 'Qualcosa non va: ' + e.message
          if (e.message === 'password') try { localStorage.removeItem(CHIAVE) } catch {}
        }
      }

      porta.addEventListener('submit', (ev) => {
        ev.preventDefault()
        errore.textContent = 'Apro…'
        prova(document.getElementById('password').value, document.getElementById('ricorda').checked)
      })

      let salvata = null
      try { salvata = localStorage.getItem(CHIAVE) } catch {}
      if (salvata) prova(salvata, true)
      else porta.hidden = false
    </script>
  </body>
</html>
